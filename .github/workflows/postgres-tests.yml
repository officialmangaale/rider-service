name: PostgreSQL integration tests

# The dispatch, delivery-completion, payout and wallet logic is only meaningful
# against a real PostgreSQL (sqlmock never runs the SQL), and those tests skip
# themselves when TEST_DATABASE_URL is unset - so the plain `go test ./...` in
# ci.yml never exercises them. This job gives them an empty database.
#
# internal/testpg refuses to run against a database that already holds
# application tables, so it cannot be pointed at a real environment by mistake.
#
# Every test runs; there is no skip list. If a fixture drifts from the queries
# again, fix the fixture (internal/testpg.ApplyLifecycle is the shared shape)
# rather than skipping the test.

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:

jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rider_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rider_it?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run tests against PostgreSQL
        run: go test ./... -count=1
